<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0f12" />
<title>LeanTV 配置</title>
<style>
  :root {
    --bg: #0e0f12;
    --card: #171a1f;
    --line: #262b33;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #3ea6ff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 16px 16px 40px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .5px; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); word-break: break-all; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4a4f57; flex: 0 0 auto; }
  .dot.online { background: #35d07f; box-shadow: 0 0 8px rgba(53, 208, 127, .8); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: #101318; border-radius: 10px; padding: 10px 12px; }
  .stat .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .stat b { font-size: 17px; font-weight: 600; }
  .sources { list-style: none; margin: 0 0 14px; padding: 0; }
  .sources .empty { color: var(--muted); font-size: 13px; padding: 10px 2px; }
  .source {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; margin-bottom: 8px;
    background: #101318; border-radius: 10px;
  }
  .source .info { min-width: 0; flex: 1; }
  .source .name { font-weight: 600; margin-bottom: 2px; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex: 0 0 auto; }
  button {
    font: inherit; font-size: 13px; border-radius: 9px; border: 1px solid var(--line);
    background: #1e232a; color: var(--text); padding: 8px 12px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; }
  button.ghost { color: var(--accent); border-color: rgba(62, 166, 255, .4); background: transparent; }
  button.danger { color: var(--danger); border-color: rgba(255, 107, 107, .4); background: transparent; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #05131f; font-weight: 600; }
  button.block { width: 100%; padding: 12px; margin-top: 14px; }
  input, select {
    width: 100%; font: inherit; color: var(--text);
    background: #101318; border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .form input { margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  .row select { flex: 1; }
  .row button { flex: 0 0 auto; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  footer { text-align: center; font-size: 12px; margin-top: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px);
    background: #232a33; color: var(--text); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .2s ease; max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { border-color: rgba(255, 107, 107, .6); }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>LeanTV</h1>
      <p id="host">正在连接电视…</p>
    </div>
    <span class="dot" id="dot"></span>
  </header>

  <section class="card">
    <div class="stats">
      <div class="stat"><span class="label">应用内存占用</span><b id="mem">—</b></div>
      <div class="stat"><span class="label">设备剩余内存</span><b id="memAvail">—</b></div>
      <div class="stat"><span class="label">频道数</span><b id="channels">—</b></div>
      <div class="stat"><span class="label">订阅源</span><b id="sourceCount">—</b></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>订阅源</h2>
      <span class="muted small" id="sourceHint"></span>
    </div>
    <ul class="sources" id="sources"></ul>
    <form class="form" id="addForm">
      <input id="srcName" type="text" placeholder="名称（可选）" autocomplete="off" />
      <input id="srcUrl" type="url" placeholder="http://example.com/live.m3u" required />
      <div class="row">
        <select id="srcType">
          <option value="AUTO">自动识别</option>
          <option value="M3U">M3U / M3U8</option>
          <option value="TXT">TXT</option>
        </select>
        <button class="primary" type="submit">添加并刷新</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>基础设置</h2>
    <label class="field">
      <span>EPG 接口地址</span>
      <input id="epg" type="url" placeholder="http://example.com/epg.xml" autocomplete="off" />
    </label>
    <label class="field">
      <span>默认解码方式</span>
      <select id="decoder">
        <option value="auto">自动（内存不足时软解）</option>
        <option value="hw">硬解优先</option>
        <option value="sw">强制软解</option>
      </select>
    </label>
    <button class="primary block" id="saveBtn" type="button">保存设置</button>
  </section>

  <footer class="muted">修改会立即写入电视端，无需重启应用。</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var state = { sources: [] };
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }

  function toast(message, isError) {
    var el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600);
  }

  function api(path, options) {
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || ('请求失败 HTTP ' + res.status));
        }
        return data.data;
      });
    });
  }

  function fmtTime(ts) {
    if (!ts) return '未更新';
    return new Date(ts).toLocaleString();
  }

  function renderSources() {
    var list = $('sources');
    list.innerHTML = '';
    $('sourceHint').textContent = state.sources.length ? state.sources.length + ' 个' : '';
    if (!state.sources.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '还没有订阅源，先添加一个 M3U 或 TXT 地址';
      list.appendChild(empty);
      return;
    }
    state.sources.forEach(function (src) {
      var li = document.createElement('li');
      li.className = 'source';

      var info = document.createElement('div');
      info.className = 'info';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = src.name || src.url;

      var meta = document.createElement('div');
      meta.className = 'muted small';
      meta.textContent = (src.type || 'AUTO') + ' · ' + fmtTime(src.lastUpdate);

      var url = document.createElement('div');
      url.className = 'muted small ellipsis';
      url.textContent = src.url;

      info.appendChild(name);
      info.appendChild(meta);
      info.appendChild(url);

      var actions = document.createElement('div');
      actions.className = 'actions';

      var refresh = document.createElement('button');
      refresh.type = 'button';
      refresh.className = 'ghost';
      refresh.textContent = '刷新';
      refresh.onclick = function () { refreshSource(src, refresh); };

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'danger';
      del.textContent = '删除';
      del.onclick = function () { removeSource(src); };

      actions.appendChild(refresh);
      actions.appendChild(del);

      li.appendChild(info);
      li.appendChild(actions);
      list.appendChild(li);
    });
  }

  function loadConfig() {
    return api('/api/config').then(function (data) {
      state.sources = Array.isArray(data.sources) ? data.sources : [];
      $('epg').value = data.epgUrl || '';
      $('decoder').value = data.decoder || 'auto';
      renderSources();
    });
  }

  function saveSources() {
    return api('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sources: state.sources.map(function (s) {
          return {
            id: s.id || 0,
            name: s.name || '',
            url: s.url,
            type: s.type || 'AUTO'
          };
        })
      })
    });
  }

  function addSource(event) {
    event.preventDefault();
    var url = $('srcUrl').value.trim();
    if (!url) return;
    var name = $('srcName').value.trim() ||
      url.replace(/^https?:\/\//, '').split('/')[0];

    state.sources.push({ id: 0, name: name, url: url, type: $('srcType').value, lastUpdate: 0 });
    renderSources();

    saveSources().then(function () {
      $('srcUrl').value = '';
      $('srcName').value = '';
      return loadConfig();
    }).then(function () {
      toast('已添加，频道正在后台更新');
    }).catch(function (err) {
      toast(err.message, true);
      loadConfig().catch(function () {});
    });
  }

  function removeSource(src) {
    if (!confirm('确定删除「' + (src.name || src.url) + '」？')) return;
    state.sources = state.sources.filter(function (s) { return s !== src; });
    renderSources();

    saveSources().then(function () {
      return loadConfig();
    }).then(function () {
      toast('已删除');
    }).catch(function (err) {
      toast(err.message, true);
      loadConfig().catch(function () {});
    });
  }

  function refreshSource(src, button) {
    if (!src.id) {
      toast('订阅源尚未保存', true);
      return;
    }
    var label = button.textContent;
    button.disabled = true;
    button.textContent = '刷新中…';

    api('/api/source/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: src.id })
    }).then(function () {
      toast('已开始刷新');
      setTimeout(function () {
        loadConfig().catch(function () {});
        loadStatus();
      }, 2500);
    }).catch(function (err) {
      toast(err.message, true);
    }).finally(function () {
      button.disabled = false;
      button.textContent = label;
    });
  }

  function saveSettings() {
    var button = $('saveBtn');
    button.disabled = true;
    api('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        epgUrl: $('epg').value.trim(),
        decoder: $('decoder').value
      })
    }).then(function () {
      toast('设置已保存');
    }).catch(function (err) {
      toast(err.message, true);
    }).finally(function () {
      button.disabled = false;
    });
  }

  function loadStatus() {
    return api('/api/status').then(function (data) {
      $('host').textContent = 'http://' + data.ip + ':' + data.port + ' · 电视端在线';
      $('mem').textContent = data.usedMb + ' MB';
      $('memAvail').textContent = data.availMb + ' MB';
      $('channels').textContent = data.channelCount;
      $('sourceCount').textContent = data.sourceCount;
      $('dot').classList.add('online');
    }).catch(function () {
      $('host').textContent = '连接电视端失败，请确认在同一局域网';
      $('dot').classList.remove('online');
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('addForm').addEventListener('submit', addSource);
    $('saveBtn').addEventListener('click', saveSettings);
    loadStatus();
    loadConfig().catch(function (err) { toast(err.message, true); });
    setInterval(loadStatus, 5000);
  });
})();
</script>
</body>
</html>
